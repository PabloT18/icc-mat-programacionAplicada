<text x="22" y="1206" font-family="DejaVu Sans" font-size="13" fill="#403F3B">Familias: EquipoCelsius crea FuenteCelsius + ConversorCelsius; EquipoFahrenheit crea FuenteFahrenheit + ConversorFahrenheit.</text></svg>